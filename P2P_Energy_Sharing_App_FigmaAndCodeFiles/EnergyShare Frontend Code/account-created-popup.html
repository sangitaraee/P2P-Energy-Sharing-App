<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnergyShare - Account Created</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #ffffff;
            --foreground: #000000;
            --muted: #f1f5f9;
            --muted-foreground: #64748b;
            --border: #e2e8f0;
            --primary: #000000;
            --primary-foreground: #ffffff;
            --card: #ffffff;
            --success: #22c55e;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .popup {
            background-color: var(--card);
            border-radius: 1rem;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .icon-container {
            margin-bottom: 1.5rem;
        }
        
        .icon {
            width: 5rem;
            height: 5rem;
            border: 2px solid #ccc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        
        .checkmark {
            width: 2.5rem;
            height: 2.5rem;
            color: var(--success);
        }
        
        .popup-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #006400;
        }
        
        .popup-message {
            font-size: 1rem;
            margin-bottom: 2rem;
            color: var(--muted-foreground);
        }
        
        .btn {
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            background-color: var(--primary);
            color: var(--primary-foreground);
            transition: background-color 0.2s;
        }
        
        .btn:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>
    <div class="popup">
        <div class="icon-container">
            <div class="icon">
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
        </div>
        
        <h2 class="popup-title">Account Created Successfully!</h2>
        <p class="popup-message">Your EnergyShare account has been created. You can now start buying and selling energy.</p>
        
        <button class="btn" onclick="redirectToDashboard()">Go to Dashboard</button>
    </div>

    <script>
        function redirectToDashboard() {
            // In a real app, this would redirect to the dashboard
            window.location.href = "dashboard.html";
        }
        
        // Auto-redirect after 5 seconds
        setTimeout(redirectToDashboard, 5000);
    </script>
</body>
</html>
