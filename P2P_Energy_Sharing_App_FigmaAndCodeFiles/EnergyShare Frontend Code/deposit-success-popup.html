<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnergyShare - Deposit Successful</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #ffffff;
            --foreground: #000000;
            --muted: #f1f5f9;
            --muted-foreground: #64748b;
            --border: #e2e8f0;
            --primary: #000000;
            --primary-foreground: #ffffff;
            --card: #ffffff;
            --success: #22c55e;
            --success-foreground: #ffffff;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        
        .popup {
            background-color: var(--card);
            border-radius: 0.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            animation: popup-appear 0.3s ease-out;
        }
        
        @keyframes popup-appear {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .popup-header {
            background-color: var(--success);
            color: var(--success-foreground);
            padding: 1.5rem;
            text-align: center;
        }
        
        .popup-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
        }
        
        .popup-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .popup-subtitle {
            font-size: 0.875rem;
            opacity: 0.9;
        }
        
        .popup-content {
            padding: 1.5rem;
        }
        
        .transaction-details {
            margin-bottom: 1.5rem;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            color: var(--muted-foreground);
            font-size: 0.875rem;
        }
        
        .detail-value {
            font-weight: 500;
            font-size: 0.875rem;
        }
        
        .popup-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            flex: 1;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: var(--primary-foreground);
        }
        
        .btn-primary:hover {
            background-color: #333333;
        }
        
        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--foreground);
        }
        
        .btn-outline:hover {
            background-color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="popup">
        <div class="popup-header">
            <svg class="popup-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <h2 class="popup-title">Deposit Successful</h2>
            <p class="popup-subtitle">Your funds have been added to your wallet</p>
        </div>
        
        <div class="popup-content">
            <div class="transaction-details">
                <div class="detail-row">
                    <span class="detail-label">Amount</span>
                    <span class="detail-value" id="deposit-amount">$100.00</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Payment Method</span>
                    <span class="detail-value" id="payment-method">Credit Card (****1234)</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Transaction ID</span>
                    <span class="detail-value" id="transaction-id">TRX-12345678</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Date & Time</span>
                    <span class="detail-value" id="transaction-date">Mar 24, 2025, 8:11 PM</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">New Balance</span>
                    <span class="detail-value" id="new-balance">$350.00</span>
                </div>
            </div>
            
            <div class="popup-actions">
                <button class="btn btn-outline" onclick="window.location.href='wallet.html'">View Wallet</button>
                <button class="btn btn-primary" onclick="window.location.href='dashboard.html'">Go to Dashboard</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const amount = urlParams.get('amount') || '100.00';
            const method = urlParams.get('method') || 'Credit Card (****1234)';
            
            // Generate a random transaction ID
            const transactionId = 'TRX-' + Math.floor(Math.random() * 10000000).toString().padStart(8, '0');
            
            // Get current date and time
            const now = new Date();
            const dateOptions = { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric',
                hour: 'numeric',
                minute: 'numeric'
            };
            const formattedDate = now.toLocaleDateString('en-US', dateOptions);
            
            // Calculate new balance (for demo purposes)
            const oldBalance = 250;
            const newBalance = oldBalance + parseFloat(amount);
            
            // Update the DOM
            document.getElementById('deposit-amount').textContent = '$' + parseFloat(amount).toFixed(2);
            document.getElementById('payment-method').textContent = method;
            document.getElementById('transaction-id').textContent = transactionId;
            document.getElementById('transaction-date').textContent = formattedDate;
            document.getElementById('new-balance').textContent = '$' + newBalance.toFixed(2);
        });
    </script>
</body>
</html>
