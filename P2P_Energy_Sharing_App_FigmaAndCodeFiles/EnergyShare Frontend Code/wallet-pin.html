<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnergyShare - Enter PIN</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: #ffffff;
        --foreground: #000000;
        --muted: #f1f5f9;
        --muted-foreground: #64748b;
        --border: #e2e8f0;
        --primary: #000000;
        --primary-foreground: #ffffff;
        --card: #ffffff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .popup {
        background-color: var(--card);
        border-radius: 1rem;
        padding: 2rem;
        width: 90%;
        max-width: 400px;
        text-align: center;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
          0 4px 6px -2px rgba(0, 0, 0, 0.05);
      }

      .popup-title {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 2rem;
      }

      .pin-container {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        margin-bottom: 2rem;
      }

      .pin-input {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 0.75rem;
        border: none;
        background-color: #f0f0f0;
        font-size: 1.5rem;
        text-align: center;
        outline: none;
      }

      .pin-input:focus {
        background-color: #e5e5e5;
      }

      .btn {
        padding: 0.75rem 2rem;
        border-radius: 0.5rem;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        border: none;
        background-color: #e2e2e2;
        transition: background-color 0.2s;
      }

      .btn:hover {
        background-color: #d1d1d1;
      }
    </style>
  </head>
  <body>
    <div class="popup">
      <h2 class="popup-title">Enter Your Wallet Pin</h2>
      <div class="pin-container">
        <input
          type="password"
          maxlength="1"
          class="pin-input"
          onkeyup="moveToNext(this, 1)"
        />
        <input
          type="password"
          maxlength="1"
          class="pin-input"
          onkeyup="moveToNext(this, 2)"
        />
        <input
          type="password"
          maxlength="1"
          class="pin-input"
          onkeyup="moveToNext(this, 3)"
        />
        <input
          type="password"
          maxlength="1"
          class="pin-input"
          onkeyup="moveToNext(this, 4)"
        />
      </div>
      <button class="btn" onclick="verifyPin()">OK</button>
    </div>

    <script>
      // Focus on the first input when the page loads
      window.onload = function () {
        document.querySelector(".pin-input").focus();
      };

      // Move to the next input field when a digit is entered
      function moveToNext(field, nextFieldNum) {
        if (field.value.length >= field.maxLength) {
          if (nextFieldNum < 4) {
            document.querySelectorAll(".pin-input")[nextFieldNum].focus();
          } else {
            field.blur();
          }
        }
      }

      // Verify the PIN (in a real app, this would validate against a stored PIN)
      function verifyPin() {
        const inputs = document.querySelectorAll(".pin-input");
        let pin = "";

        inputs.forEach((input) => {
          pin += input.value;
        });

        // For demo purposes, we'll consider "1234" as the correct PIN
        if (pin === "1234") {
          // Redirect to wallet page or perform action
          window.location.href = "wallet.html";
        } else {
          // Show error (in a real app, this would show an error message)
          alert("Incorrect PIN! Please try again.");

          // Clear inputs
          inputs.forEach((input) => {
            input.value = "";
          });

          // Focus on first input
          inputs[0].focus();
        }
      }
    </script>
  </body>
</html>
